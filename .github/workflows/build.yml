name: Verify and publish Katchamak
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: katchamak-main-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - id: install
        run: bun install --frozen-lockfile
      - name: Test storage rehydration
        run: bun run tests/rehydration.test.mjs
      - name: Test collection hierarchy and migration
        run: bun run tests/library.test.mjs
      - name: Test release authorization and activation
        run: bun run tests/release-store.test.mjs
      - name: Test application refresh
        run: bun run tests/application-updates.test.mjs
      - name: Test workspace synchronization and recovery
        run: bun run tests/workspace-sync.test.mjs
      - name: Type-check application
        run: bun run typecheck
      - name: Build Sites package
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: bun run build
      - name: Verify release source and application entrypoint
        run: bun run check:release
      - name: Publish and verify the same application on Sites
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: bun run publish:github
