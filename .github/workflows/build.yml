name: Build and type-check
on:
  push:
    branches: [main, codex/dashboard-composition-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - id: install
        run: bun install --frozen-lockfile
      - name: Test storage rehydration
        run: bun run tests/rehydration.test.mjs
      - name: Type-check application
        run: |
          printf '%s\n' '{"extends":"./tsconfig.json","exclude":["node_modules","examples","skills"]}' > tsconfig.ci.json
          bunx tsc --noEmit -p tsconfig.ci.json
      - name: Build Sites package
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: bun run build
      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-composition-build
          path: |
            dist/
            out/
