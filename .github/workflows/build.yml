name: Verify Katchamak cloud
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: katchamak-main-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - id: install
        run: bun install --frozen-lockfile
      - name: Test storage rehydration
        run: bun run tests/rehydration.test.mjs
      - name: Test collection hierarchy and migration
        run: bun run tests/library.test.mjs
      - name: Test release authorization and activation
        run: bun run tests/release-store.test.mjs
      - name: Test authenticated cloud storage and cross-view saves
        run: bun run tests/cloud-library.test.mjs
      - name: Test account authorization
        run: bun run tests/account-auth.test.mjs
      - name: Test local account settings
        run: bun run tests/account-preferences.test.mjs
      - name: Test desktop release checks
        run: bun run tests/desktop-releases.test.mjs
      - name: Test application refresh
        run: bun run tests/application-updates.test.mjs
      - name: Test workspace synchronization and recovery
        run: bun run tests/workspace-sync.test.mjs
      - name: Test verified desktop synchronization
        run: bun run tests/desktop-sync.test.mjs
      - name: Test project-file persistence
        run: bun run tests/project-files.test.mjs
      - name: Type-check application
        run: bun run typecheck
      - name: Build Sites application
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: node scripts/run-target.mjs sites scripts/build-project.mjs
      - name: Verify Sites application assets
        run: bun run check:release
  windows-desktop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Build Windows desktop installer
        run: bun run desktop:build
      - name: Test native project files
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: Katchamak-Windows
          path: src-tauri/target/project-files/release/bundle/nsis/*-setup.exe
