name: Build and type-check
on:
  push:
    branches: [main, codex/dashboard-library-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - id: install
        run: bun install --frozen-lockfile
      - name: Test storage rehydration
        run: bun run tests/rehydration.test.mjs
      - name: Type-check application
        run: |
          printf '%s\n' '{"extends":"./tsconfig.json","exclude":["node_modules","examples","skills"]}' > tsconfig.ci.json
          bunx tsc --noEmit -p tsconfig.ci.json
      - name: Build Sites package
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: bun run build
      - name: Install isolated browser test runtime
        run: npm install --prefix .qa-runtime --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install test browser
        run: .qa-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser library regression checks
        run: |
          python3 -m http.server 4173 --directory out >/tmp/katchamak-preview.log 2>&1 &
          node tests/dashboard-library.browser.cjs
      - name: Save library build and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-library-build
          path: |
            dist/
            out/
            qa-results/
